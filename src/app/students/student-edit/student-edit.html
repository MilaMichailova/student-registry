<div class="student-form-page app-page">
  <div class="app-page-header">
    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <a routerLink="/students">Студенты</a>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>{{ studentName() || 'Редактирование' }}</nz-breadcrumb-item>
    </nz-breadcrumb>
  </div>

  @switch (loadState()) {
    @case ('loading') {
      <div class="app-page-state"><nz-spin nzSimple nzSize="large" /></div>
    }
    @case ('notFound') {
      <nz-result
        nzStatus="404"
        nzTitle="Студент не найден"
        nzSubTitle="Возможно, запись уже удалена."
      >
        <div nz-result-extra>
          <a nz-button nzType="primary" routerLink="/students">К списку студентов</a>
        </div>
      </nz-result>
    }
    @case ('error') {
      <nz-result nzStatus="error" nzTitle="Не удалось загрузить данные">
        <div nz-result-extra>
          <button nz-button nzType="primary" type="button" (click)="loadStudent()">
            Повторить
          </button>
        </div>
      </nz-result>
    }
    @default {
      <nz-spin [nzSpinning]="saving()" [attr.aria-busy]="saving()">
        <form
          [formGroup]="form"
          nz-form
          nzLayout="vertical"
          (ngSubmit)="saveStudent()"
          [inert]="saving()"
          novalidate
        >
          <app-student-form-sections [host]="this" />

          <div class="app-form-actions">
            <button nz-button nzType="default" type="button" (click)="onCancel()">Отмена</button>
            <button nz-button nzType="primary" type="submit">
              <nz-icon nzType="save" nzTheme="outline" />
              Сохранить изменения
            </button>
          </div>
        </form>
      </nz-spin>
    }
  }
</div>
