<nz-collapse class="app-form-section" [nzBordered]="true" nzExpandIconPosition="end">
  <nz-collapse-panel
    nzHeader="Технические навыки"
    [nzActive]="active"
    (nzActiveChange)="onActiveChange($event)"
  >
    <div [formGroup]="formGroup" class="app-form-grid">
      @for (field of fields; track field.controlName) {
        <nz-form-item>
          <nz-form-label>{{ field.label }}</nz-form-label>
          <nz-form-control nzExtra="Через запятую">
            <input
              nz-input
              [formControlName]="field.controlName"
              [placeholder]="field.placeholder"
            />
            <div class="tag-preview">
              @for (tag of parseTags(formGroup.controls[field.controlName].value); track $index) {
                <nz-tag>{{ tag }}</nz-tag>
              }
            </div>
          </nz-form-control>
        </nz-form-item>
      }
    </div>
  </nz-collapse-panel>
</nz-collapse>
