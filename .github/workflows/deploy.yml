# Сборка и публикация демо на GitHub Pages при каждом push в main.
# В настройках репозитория: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Публикуем только сборку, прошедшую тесты.
      - run: npm run test:ci

      # base-href под адрес /student-registry/ и 404.html = index.html,
      # чтобы прямые ссылки на маршруты Angular открывались, а не давали 404.
      - run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/student-registry/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
